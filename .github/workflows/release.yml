name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and test
        run: |
          cargo build --release --locked --package pngdeer --target "$TARGET"
          cargo test --release --locked --package pngdeer --target "$TARGET"
      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pngdeer"))')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          mkdir -p dist package
          cp "target/$TARGET/release/pngdeer" LICENSE-MIT LICENSE-APACHE package/
          python3 scripts/release-notices.py --target "$TARGET" --output package/THIRD_PARTY_LICENSES.txt
          archive="pngdeer-$version-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C package pngdeer LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.txt
          mkdir smoke
          tar -xzf "dist/$archive" -C smoke
          smoke/pngdeer bench/images/icons/twemoji-1f4a1.png -o smoke/output.png
          smoke/pngdeer bench/images/icons/twemoji-1f4a1.png --score smoke/output.png
          test -s smoke/output.png
      - uses: actions/upload-artifact@v4
        with:
          name: pngdeer-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
