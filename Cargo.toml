[package]
name = "slimdeer"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Smaller PNG and JPEG images, or WebP and AVIF, that keep a SSIMULACRA2 quality picked per image. The same code runs on the command line and in the browser (web/)."
readme = "README.md"
repository = "https://github.com/heydeer/slimdeer"
# The library, the command line and their tests; not bench/'s images, web/ or the other tools.
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[features]
default = ["parallel", "oxipng", "webp", "jpeg", "avif"]
# Threads for palettes, remapping, scoring, oxipng and libaom (web/'s threaded build turns it on too).
# Results don't depend on the number of threads.
parallel = ["dep:rayon", "fast-ssim2/rayon", "oxipng?/parallel", "aom?/parallel"]
# compress() recompresses its final file with oxipng -o 2.
oxipng = ["dep:oxipng"]
# WebP output (slimdeer::compress_webp), with the vendored libwebp (vendor/libwebp).
webp = ["dep:libwebp"]
# JPEG output (slimdeer::compress_jpeg): the vendored mozjpeg (vendor/mozjpeg) encodes, zune-jpeg decodes.
jpeg = ["dep:mozjpeg", "dep:zune-jpeg", "dep:zune-core"]
# AVIF output (slimdeer::compress_avif), with the vendored libaom (vendor/libaom).
avif = ["dep:aom"]
# For wasm32: oxipng's libdeflate built without libc (needs a clang that targets wasm32, see web/build.sh).
freestanding = ["oxipng?/freestanding"]

[dependencies]
aom = { package = "slimdeer-libaom", path = "vendor/libaom", optional = true }
crc32fast = "1.5.3"
fast-ssim2 = "0.9.0"
# Math functions that give the same bits on every platform (std's come from the system libm on
# native targets), so the browser build's output matches the command line's.
libm = "0.2.16"
libwebp = { package = "slimdeer-libwebp", path = "vendor/libwebp", optional = true }
miniz_oxide = "0.9.1"
mozjpeg = { package = "slimdeer-mozjpeg", path = "vendor/mozjpeg", optional = true }
oxipng = { version = "10.2.1", default-features = false, optional = true }
png = "0.18.1"
rayon = { version = "1", optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"] }
# Without its x86 and neon features: its plain Rust decoding gives the same pixels on every target.
zune-core = { version = "0.5", optional = true }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"], optional = true }

[workspace]
members = [".", "web/wasm", "tools/quantlab", "tools/webplab", "tools/aviflab", "vendor/mozjpeg", "vendor/libaom"]
default-members = ["."]
resolver = "2"

# fast-ssim2 with speed and memory patches (same scores), for every build: see vendor/fast-ssim2/PATCHES.md.
[patch.crates-io]
fast-ssim2 = { path = "vendor/fast-ssim2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
