[package]
name = "pngdeer-mozjpeg"
version = "4.1.5"
edition = "2021"
# mozjpeg is libjpeg-turbo's licenses: IJG and BSD-3-Clause (mozjpeg/LICENSE.md, mozjpeg/README.ijg);
# the Rust, glue and config code here is pngdeer's, MIT.
license = "IJG AND BSD-3-Clause AND MIT"
description = "mozjpeg 4.1.5's encoder for pngdeer: JPEG encoding with the same bytes on every target"
publish = false

[lib]
name = "mozjpeg"

[dependencies]
# the C library functions mozjpeg calls (math, and on wasm32 the allocator and stubs), the same everywhere
pngdeer-clib = { path = "../clib" }

[build-dependencies]
cc = "1"
