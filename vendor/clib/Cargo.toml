[package]
name = "slimdeer-clib"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The C library functions slimdeer's vendored C code (libwebp, mozjpeg) calls, the same on every target"
publish = false
# build scripts of the crates that depend on this one read its header folders from DEP_SLIMDEER_CLIB_*
links = "slimdeer_clib"

[lib]
name = "slimdeer_clib"

[dependencies]
# the inexact math functions (include/slimdeer_clib.h), the same bits on every target
libm = "0.2.16"

[build-dependencies]
cc = "1"
